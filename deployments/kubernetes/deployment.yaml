apiVersion: apps/v1
kind: Deployment
metadata:
  name: otelcol-zabbix
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otelcol-zabbix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otelcol-zabbix
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: otelcol-zabbix
          image: zabbix-otel-collector:local
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol-zabbix/config.yaml"]
          ports:
            - name: health
              containerPort: 13133
              protocol: TCP
            - name: telemetry
              containerPort: 8888
              protocol: TCP
          env:
            - name: ZABBIX_URL
              valueFrom:
                secretKeyRef:
                  name: otelcol-zabbix
                  key: ZABBIX_URL
            - name: ZABBIX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: otelcol-zabbix
                  key: ZABBIX_TOKEN
            - name: VICTORIAMETRICS_REMOTE_WRITE_URL
              valueFrom:
                configMapKeyRef:
                  name: otelcol-zabbix
                  key: VICTORIAMETRICS_REMOTE_WRITE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-zabbix
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otelcol-zabbix
            items:
              - key: config.yaml
                path: config.yaml
