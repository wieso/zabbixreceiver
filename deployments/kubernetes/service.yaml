apiVersion: v1
kind: Service
metadata:
  name: otelcol-zabbix
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otelcol-zabbix
  ports:
    - name: health
      port: 13133
      targetPort: health
      protocol: TCP
    - name: telemetry
      port: 8888
      targetPort: telemetry
      protocol: TCP
