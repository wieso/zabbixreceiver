global
    log stdout format raw local0
    maxconn 64
defaults
    log global
    mode http
    timeout connect 2s
    timeout client 15s
    timeout server 15s
    timeout queue 5s
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
frontend history
    bind :8081
    default_backend collectors
backend collectors
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    # Health checks use the Collector extension, not the POST-only history URL.
    # Do not replay POSTs automatically; the connector owns retries.
    retries 0
    server s1 stream-1:8081 check port 13133 inter 1s fall 2 rise 2 maxconn 4 resolvers docker init-addr libc,none
    server s2 stream-2:8081 check port 13133 inter 1s fall 2 rise 2 maxconn 4 resolvers docker init-addr libc,none
